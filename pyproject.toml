[project]
name = "modelfactory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Select specific rule categories (e.g., pycodestyle, pyflakes, isort)
select = ["E", "F", "I", "UP", "B", "N", "SIM"]

[build-system]
requires = ["uv_build >= 0.13, <0.14"]
build-backend = "uv_build"

[project]
name = "modelfactory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Select specific rule categories (e.g., pycodestyle, pyflakes, isort)
select = ["E", "F", "I", "UP"]   
